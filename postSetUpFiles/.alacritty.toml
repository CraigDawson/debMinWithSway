[font]
size = 14.0
normal = { family = "0xProto Nerd Font Mono", style = "Regular" }

# Alacritty configuration in TOML format from Bing AI

[window]
# Window dimensions in columns and lines (0 = use default)
dimensions = { columns = 100, lines = 30 }
# Window padding in pixels
padding = { x = 10, y = 10 }
# Whether window is resizable
dynamic_padding = true
decorations = "full"
#opacity = 0.95

#[font]
#normal = { family = "FiraCode Nerd Font", style = "Regular" }
#bold = { family = "FiraCode Nerd Font", style = "Bold" }
#italic = { family = "FiraCode Nerd Font", style = "Italic" }
#size = 13.0

[scrolling]
history = 10000
multiplier = 3

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#ffffff"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5c2e7"

[colors.selection]
text = "#1e1e2e"
background = "#a6adc8"

